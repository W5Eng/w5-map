  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"815551a0-00b8-40f8-8e18-1ed136ec3139\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0;background:#0e1b2a;font-family:Arial,Helvetica,sans-serif;color:#e8eef5;-webkit-text-size-adjust:100%;text-size-adjust:100%}\na{color:#8fc1ff}a:hover{color:#b8d8ff}\ninput,select,button,textarea{font-family:inherit}\n::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a4059;border-radius:5px}\n@media (max-width:860px){\n  [data-m=head]{flex-wrap:wrap;gap:6px !important;padding:8px 11px !important}\n  [data-m=head] [data-m=srv]{flex:1 1 100%;white-space:normal !important;overflow:visible !important}\n  [data-m=head] [data-m=admin]{margin-left:0 !important}\n  [data-m=page]{flex-direction:column;align-items:stretch !important;padding:11px 11px 40px !important}\n  [data-m=side]{flex:1 1 auto !important;width:100%;position:static !important}\n  [data-m=sidelist]{max-height:44vh !important}\n  [data-m=field]{flex:1 1 100% !important}\n  [data-m=ratewrap]{overflow-x:auto;-webkit-overflow-scrolling:touch}\n  [data-m=raterow]{min-width:520px}\n  [data-m=ratelab]{flex:0 0 150px !important}\n}\n@media (max-width:520px){\n  [data-m=agrow]{padding:11px !important;font-size:13px !important}\n}\n<\u002Fstyle>\n<script>/* server ADDRESS only — no data lives here */\n(function(){try{var CFG={endpoint:'https://script.google.com/macros/s/AKfycbwdmBdhq1bvKMlSDC9DQfOT7dFqgM8Z9HNCR2cqbMHr-VWtRYsWFClL75cVriIXnBXD/exec',token:'w5eng-3f9a2c81d4b6',adminEndpoint:'https://script.google.com/a/macros/w5engineering.com/s/AKfycbylwKKcfZ543KX0qT6vvJ4AhjGc0VMI70VQooAoptCLXDgryKDKt8rtiCO2g8UTol3d/exec'};var cur={};try{cur=JSON.parse(localStorage.getItem('w5db:server')||'{}');}catch(e){}if(cur.endpoint!==CFG.endpoint||cur.token!==CFG.token||cur.adminEndpoint!==CFG.adminEndpoint){localStorage.setItem('w5db:server',JSON.stringify(Object.assign({actor:'agency-contracts'},cur,CFG)));}}catch(e){}})();\n<\u002Fscript>\n<script src=\"7e3f2fbc-1728-44c3-b411-8b861ce1fec6\"><\u002Fscript>\n<script src=\"6e972135-58c9-45d0-9a2b-0c23bfca662f\"><\u002Fscript>\n<script src=\"f3ab75aa-9f78-4dbc-bc67-5e244fc9d2b7\"><\u002Fscript>\n<script src=\"83200412-ac62-4c9e-9960-f1e4567b28d2\"><\u002Fscript>\n<script src=\"8ab28309-8377-4404-ade9-00152d4b7b08\"><\u002Fscript>\n<script src=\"0d8da75b-ea16-4537-b355-b3dcfcdcca59\"><\u002Fscript>\n<script src=\"1eea147c-cb55-4a1d-8457-1c4786aa5b92\"><\u002Fscript>\n<script src=\"f07cce7d-7116-45e6-b663-9a82ee17bb0e\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#0e1b2a\">\n  <div data-m=\"head\" style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0a1626;border-bottom:1px solid #1e344d;position:sticky;top:0;z-index:5\">\n    <span style=\"flex:none;white-space:nowrap;font-size:14px;font-weight:800;letter-spacing:.02em\">W5-to-Agency Contracts<\u002Fspan>\n    <span style=\"flex:none;white-space:nowrap;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:#5a2a2a;color:#ffd7d7;border-radius:4px;padding:2px 7px\">INTERNAL · ADMIN ONLY<\u002Fspan>\n    <span data-m=\"srv\" style=\"font-size:11px;color:#7f93a8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ srvNote }}<\u002Fspan>\n    <span data-m=\"admin\" style=\"margin-left:auto;flex:none;white-space:nowrap;font-size:11px;color:#7f93a8\">{{ adminNote }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:520px;margin:80px auto;background:#122336;border:1px solid #1e344d;border-radius:12px;padding:22px\">\n      <div style=\"font-size:15px;font-weight:800\">{{ blockTitle }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#9fb3c8;margin-top:8px;line-height:1.6\">{{ blockBody }}<\u002Fdiv>\n      <sc-if value=\"{{ canSignIn }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ signIn }}\" style=\"margin-top:14px;background:#2E6DA4;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer\">Sign in with your W5 account<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ canClaim }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:6px;margin-top:14px;flex-wrap:wrap\">\n          <sc-raw-select sc-camel-on-change=\"{{ fClaim }}\" style=\"flex:1;min-width:180px;background:#0e1b2a;border:1px solid #2a4059;border-radius:6px;color:#e8eef5;font-size:12px;padding:7px\">\n            <option value=\"\">{{ claimPlaceholder }}<\u002Foption>\n            <sc-for list=\"{{ peopleOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <button sc-camel-on-click=\"{{ claim }}\" style=\"flex:none;white-space:nowrap;background:#2E6DA4;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer\">{{ claimLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ open }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-m=\"page\" style=\"display:flex;align-items:flex-start;gap:14px;padding:14px 16px 40px\">\n      <div data-m=\"side\" style=\"flex:0 0 264px;background:#122336;border:1px solid #1e344d;border-radius:10px;overflow:hidden;position:sticky;top:62px\">\n        <div style=\"padding:7px 11px;background:#0D4C8F;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px\">\n          <span>Agencies<\u002Fspan><span style=\"margin-left:auto;opacity:.75\">{{ agencyCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div data-m=\"sidelist\" style=\"max-height:70vh;overflow:auto\">\n          <sc-for list=\"{{ agencyRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div data-m=\"agrow\" sc-camel-on-click=\"{{ a.pick }}\" style=\"display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:12px;border-bottom:1px solid #1a2f45;cursor:pointer;background:{{ a.bg }}\" style-hover=\"background:#183050\">\n              <span style=\"width:7px;height:7px;border-radius:50%;background:{{ a.dot }};flex:0 0 7px\"><\u002Fspan>\n              <span style=\"flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ a.name }}<\u002Fspan>\n              <span style=\"flex:none;white-space:nowrap;font-size:9.5px;font-weight:800;color:{{ a.tagC }}\">{{ a.tag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:8px 11px;font-size:10.5px;color:#7f93a8;line-height:1.5;border-top:1px solid #1a2f45\">{{ railFoot }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:12px\">\n        <sc-if value=\"{{ noSel }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#122336;border:1px solid #1e344d;border-radius:10px;padding:26px;font-size:12.5px;color:#9fb3c8;line-height:1.6\">{{ emptyHint }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#122336;border:1px solid #1e344d;border-radius:10px;padding:14px\">\n            <div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap\">\n              <b style=\"font-size:16px\">{{ selName }}<\u002Fb>\n              <span style=\"font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#1e344d;color:#c6d4e2;border-radius:5px;padding:2px 7px\">{{ selStatus }}<\u002Fspan>\n              <span style=\"font-size:11px;color:#7f93a8\">{{ selMeta }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ noContract }}\" hint-placeholder-val=\"{{ false }}\">                     <span style=\"flex:0 0 14px;text-align:right;color:#54677d\">{{ t.n }}<\u002Fspan>\n                      <span style=\"flex:1\">{{ t.text }}<\u002Fspan>\n                      <span style=\"flex:none;font-weight:800;color:{{ t.vc }}\">{{ t.val }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"font-size:10.5px;color:#54677d;flex:1;line-height:1.5\">{{ prov }}<\u002Fspan>\n              <button data-w5-edit=\"\" sc-camel-on-click=\"{{ delContract }}\" style=\"flex:none;background:transparent;color:#c96a6a;border:1px solid #5a2a2a;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer\">Delete contract<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"background:#0f1d30;border:1px dashed #2a4059;border-radius:10px;padding:14px\">\n            <div sc-camel-on-click=\"{{ toggleDefs }}\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer\">\n              <b style=\"font-size:12.5px;color:#9fb3c8\">Template defaults<\u002Fb>\n              <span style=\"font-size:11px;color:#54677d\">seed new contracts — existing contracts keep their own terms · from the SubFinal Sub-Representation Agreement<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:11px;color:#7f93a8\">{{ defsArrow }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showDefs }}\" hint-placeholder-val=\"{{ false }}\">\n              <div data-m=\"ratewrap\"><div data-m=\"raterow\" style=\"display:flex;gap:6px;margin-top:12px;font-size:10px;font-weight:800;color:#7f93a8;text-transform:uppercase;letter-spacing:.04em\">\n                <span data-m=\"ratelab\" style=\"flex:0 0 250px\">Model<\u002Fspan>\n                <sc-for list=\"{{ defSmCols }}\" as=\"c\" hint-placeholder-count=\"5\"><span style=\"flex:1;text-align:center\">{{ c.label }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ defRateRows }}\" as=\"rr\" hint-placeholder-count=\"3\">\n                <div data-m=\"raterow\" style=\"display:flex;gap:6px;margin-top:6px;align-items:center\">\n                  <span data-m=\"ratelab\" style=\"flex:0 0 250px;min-width:0\">\n                    <span style=\"display:block;font-size:12.5px;font-weight:700\">{{ rr.label }}<\u002Fspan>\n                    <span style=\"display:block;font-size:10.5px;color:#7f93a8\">{{ rr.sub }}<\u002Fspan>\n                  <\u002Fspan>\n                  <sc-for list=\"{{ rr.cells }}\" as=\"c\" hint-placeholder-count=\"5\">\n                    <input key=\"{{ c.key }}\" sc-camel-default-value=\"{{ c.val }}\" sc-camel-on-blur=\"{{ c.commit }}\" style=\"flex:1;min-width:0;box-sizing:border-box;background:#0e1b2a;border:1px solid #2a4059;border-radius:6px;color:#e8eef5;font-size:12.5px;padding:6px 4px;text-align:center\">\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for><\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:12px\">\n                <sc-for list=\"{{ defFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <div data-m=\"field\" style=\"flex:0 0 130px\">\n                    <div style=\"font-size:10px;color:#7f93a8;font-weight:700;text-transform:uppercase;letter-spacing:.04em\">{{ f.label }}<\u002Fdiv>\n                    <input key=\"{{ f.key }}\" sc-camel-default-value=\"{{ f.val }}\" sc-camel-on-blur=\"{{ f.commit }}\" style=\"width:100%;box-sizing:border-box;background:#0e1b2a;border:1px solid #2a4059;border-radius:6px;color:#e8eef5;font-size:12.5px;padding:6px 8px;margin-top:3px;text-align:center\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:#7f93a8;margin-top:9px;line-height:1.5\">{{ defFoot }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  state = { sel: null, claimP: '', tick: 0, showDefs: false, showNonExcl: false, calcModel: null, calcSm: null, calcNet: '', calcInc: '', calcIncMode: '%' };\n\n  /* ---- server plumbing: address only, never data ---- */\n  srvCfg() { try { return JSON.parse(localStorage.getItem('w5db:server') || '{}'); } catch (e) { return {}; } }\n  SRVC() { return window.W5DBServer || window.W5DB; }\n  srvOn() { var c = this.srvCfg(); return !!(c.endpoint && this.SRVC()); }\n  srvInit() {\n    if (!this.srvOn()) return;\n    var self = this, c = this.srvCfg(), C = this.SRVC();\n    if (C.status().endpoint === c.endpoint && this._srvClient === C) return;\n    this._srvClient = C;\n    C.configure({ endpoint: c.endpoint, token: c.token || '', actor: 'agency-contracts' });\n    C.subscribe(function () { self._srvReady = true; self._rec = null; self._base = null; self.forceUpdate(); });\n    this._srvErr = null; this._srvReady = false;\n    C.ready().then(function () { self._srvReady = true; self._rec = null; self._base = null; self.forceUpdate(); })\n      .catch(function (e) { self._srvErr = e.message; self._srvReady = true; self.forceUpdate(); });\n  }\n  componentDidMount() { this.srvInit(); if (!this.srvOn()) { this._srvErr = 'No database server configured.'; this.forceUpdate(); } }\n  rec() {\n    if (!this.srvOn()) return null;\n    this.srvInit();\n    if (this._rec) return this._rec;\n    var C = this.SRVC();\n    if (!this._srvReady && (C.status().version == null)) return null;\n    var live = C.data();\n    if (!live) return null;\n    this._base = JSON.stringify(live);\n    var r = JSON.parse(this._base);\n    r.generalExtras = r.generalExtras || {};\n    this._rec = r;\n    return r;\n  }\n  write(desc) {\n    var rec = this._rec, base = JSON.parse(this._base || '{}');\n    var a = (base.generalExtras || {}), b = (rec.generalExtras || {});\n    var ops = [];\n    Object.keys(b).forEach(function (k) { if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) ops.push({ table: 'generalExtras', id: k, patch: b[k], replace: true }); });\n    if (!ops.length) return;\n    var C = this.SRVC();\n    if (C.mutate) C.mutate(ops, desc); else if (C.stage) C.stage(ops, desc);\n    this._base = JSON.stringify(rec);\n    this.setState({ tick: this.state.tick + 1 });\n  }\n  op(desc, run) { var rec = this.rec(); if (!rec) return; run(rec); this.write(desc); }\n  uid() { return 'ac' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\n  num(v) { var n = parseFloat(String(v).replace(/[^0-9.\\-]/g, '')); return isFinite(n) ? n : null; }\n  money(n) { return n == null ? '' : '$' + (Math.round(n * 100) / 100).toLocaleString(); }\n  pct(n) { return n == null ? '' : (Math.round(n * 100) / 100) + '%'; }\n  dISO(v) {\n    var s = String(v == null ? '' : v).trim();\n    if (!s) return '';\n    var m = s.match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{4})$/);\n    if (m) return m[3] + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2);\n    if (/^\\d{4}-\\d{2}-\\d{2}$/.test(s)) return s;\n    return s;\n  }\n  dShow(v) {\n    var s = String(v == null ? '' : v).trim();\n    var m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n    return m ? m[2] + '/' + m[3] + '/' + m[1] : s;\n  }\n\n  contracts(rec) { return (rec.generalExtras || {}).agencyContracts || {}; }\n  vocab(rec) { return (rec.generalExtras || {}).agencyContractVocab || null; }\n  admins(rec) { return ((rec.generalExtras || {}).contractsAdmins || []); }\n  meId(rec) {\n    var c = this.srvCfg();\n    if (c.person && rec.people[c.person]) return c.person;\n    var who = c.personName || '';\n    if (!who) rther down: reading it now would resolve to undefined\n         and every chip would silently lose its paperwork comparison. */\n      var splitDoc = function (v) {\n        if (Array.isArray(v)) return v.slice();\n        return String(v || '').split(/,\\s*/).map(function (x) { return x.trim(); }).filter(Boolean);\n      };\n      var docX = docExcl ? keySet(splitDoc(docExcl)) : null;\n      var docN = docNon ? keySet(splitDoc(docNon)) : null;\n\n      var setGrp = function (pk, grp, on) {\n        var label = pname(pk) + (on ? ' \\u2192 ' + (grp === 'x' ? 'exclusive' : 'non-exclusive') : ' removed from ' + (grp === 'x' ? 'exclusive' : 'non-exclusive'));\n        setScope(label, function (c) {\n          var mine = grp === 'x' ? 'exclusiveMfrs' : 'nonExclusiveMfrs';\n          var other = grp === 'x' ? 'nonExclusiveMfrs' : 'exclusiveMfrs';\n          /* strip by RESOLVED KEY, not by string, so a nickname or a legacy spelling of the\n             same partner cannot survive as a duplicate under a different name */\n          var strip = function (list) { return (list || []).filter(function (n) { return keyOf(n) !== pk; }); };\n          c[mine] = strip(c[mine]);\n          if (on) c[mine].push(pname(pk));\n          c[other] = strip(c[other]);\n          if (!c[mine].length) delete c[mine];\n          if (!c[other].length) delete c[other];\n        });\n      };\n\n      var cloud = function (grp) {\n        var recMine = grp === 'x' ? recX : recN, recOther = grp === 'x' ? recN : recX;\n        var docMine = grp === 'x' ? docX : docN, docOther = grp === 'x' ? docN : docX;\n        var mineWord = grp === 'x' ? 'exclusive' : 'non-exclusive', otherWord = grp === 'x' ? 'non-exclusive' : 'exclusive';\n        return Object.keys(rec.partners).map(function (pk) {\n          return { pk: pk, nm: pname(pk) };\n        }).sort(function (a, b) { return a.nm.localeCompare(b.nm); }).map(function (p) {\n          var on = !!recMine[p.pk], inDoc = docMine ? !!docMine[p.pk] : null, star = '', why;\n          if (on) why = 'Recorded as ' + mineWord + ' for this agency.';\n          else if (recOther[p.pk]) why = 'Recorded as ' + otherWord + ' \\u2014 selecting here moves it.';\n          else why = 'Not on this agreement. Click to record it as ' + mineWord + '.';\n          if (inDoc === true && !on) {\n            star = '\\u2731';\n            why = 'DIFFERS FROM THE PAPERWORK. The signed agreement lists ' + p.nm + ' as ' + mineWord +\n                  '; the record does not' + (recOther[p.pk] ? ' \\u2014 it is recorded as ' + otherWord + ' instead' : '') +\n                  '. The record is what publishes; update the paperwork, or put it back.';\n          } else if (inDoc === false && on) {\n            star = '\\u2731';\n            why = 'DIFFERS FROM THE PAPERWORK. ' + p.nm + ' is recorded as ' + mineWord +\n                  ' but the signed agreement does not list it there' +\n                  (docOther && docOther[p.pk] ? ' \\u2014 the document has it as ' + otherWord : '') +\n                  '. Likely a later amendment: update the paperwork so the two agree.';\n          }\n          var c = on ? (star ? { bg: '#7a5a1f', fg: '#fff', bd: '#c8922e' } : { bg: '#1f7a33', fg: '#fff', bd: '#1f7a33' })\n                     : (star ? { bg: 'transparent', fg: '#e8c07d', bd: '#c8922e' } : { bg: 'transparent', fg: '#8fa7bd', bd: '#2a4059' });\n          /* a paperwork-only line says so on hover, so nobody reads its presence in the cloud\n             as W5 carrying the line */\n          if ((rec.partners[p.pk] || {}).mapTab === false) why += ' Paperwork-only line \\u2014 no W5 map tab.';\n          return { name: p.nm, star: star, title: why, bg: c.bg, fg: c.fg, bd: c.bd,\n            other: !on && !!recOther[p.pk],\n            tog: function () { setGrp(p.pk, grp, !on); } };\n        });\n      };\n      base.exclCloud = cloud('x');\n      base.nonCloud = cloud('n');\n      base.exclCount = xm.length + ' selected';\n      base.nonCount = nm.length + ' selected';\n      var toList = function (v) {\n        if (Array.isArray(v)) return v.slice();\n        return String(v || '').split(/,\\s*/).map(function (x) { return x.trim(); }).filter(Boolean);\n      };\n      /* only offered when the paperwork resolves to codes — reverting a region-style\n         territory would replace real codes with sentence fragments */\n      base.canRevertTerr = !!(base.terrDiv && docTerrCodes);\n      base.terrRevertNote = base.terrDiv && !docTerrCodes\n        ? 'paperwork wording cannot be resolved to states \\u2014 edit by hand' : '';\n      base.revertTerr = function () {\n        if (!docTerrCodes) return;\n        setScope('territory reverted to paperwork', function (c) { c.territoryStates = docTerrCodes.slice(); });\n      };\n      base.revertExcl = function () { setScope('exclusive lines reverted to paperwork', function (c) { c.exclusiveMfrs = toList(docExcl); }); };\n      base.revertAll = function () {\n        setScope('reverted to paperwork', function (c) {\n          if (docTerrCodes) c.territoryStates = docTerrCodes.slice();\n          if (docExcl) c.exclusiveMfrs = toList(docExcl);\n          var dn = docOf('nonExclusiveMfrs'); if (dn) c.nonExclusiveMfrs = toList(dn);\n        });\n      };\n      base.onUpload = function (e) {\n        var f = e.target && e.target.files && e.target.files[0];\n        if (!f) return;\n        self.setState({ uploadMsg: '\\u201c' + f.name + '\\u201d is not stored yet \\u2014 attach it in chat and I will parse it into a new paperwork baseline for ' + ag.name + '.' });\n      };\n      base.nonExclLabel = (st.showNonExcl ? '\\u25b4 ' : '\\u25be ') + nm.length + ' non-exclusive / distribution lines';\n      base.nonExclList = nm;\n      var w5l = ct.w5eOwnLines || [];\n      /* the contract stores TOKENS now; labels come from generalExtras.w5eOwnLines, the one\n         owner of the vocabulary. It used to store the display labels on every contract — the\n         same eight strings copied eight times, which is how one of them drifted to\n         \"Engineering Service\" and read as a ninth line. */\n      var W5LINES = ((rec.generalExtras || {}).w5eOwnLines) || [];\n      var lineLabel = function (t) {\n        var hit = W5LINES.filter(function (l) { return l.token === t; })[0];\n        return hit ? hit.label : t;\n      };\n      base.w5eGroup = W5LINES.map(function (l) {\n        var on = w5l.indexOf(l.token) >= 0;\n        return { label: l.label, on: on,\n          bg: on ? '#1f7a33' : 'transparent', fg: on ? '#ffffff' : '#8fa7bd', bd: on ? '#1f7a33' : '#2a4059',\n          title: on ? 'On this agreement as a W5E own line — non-exclusive to the agency.'\n                    : 'Not named on this agreement. Click to add it.',\n          tog: function () {\n            setScope((on ? 'remove ' : 'add ') + l.label, function (c) {\n              var cur = (c.w5eOwnLines || []).slice();\n              if (on) cur = cur.filter(function (x) { return x !== l.token; });\n              else if (cur.indexOf(l.token) < 0) cur.push(l.token);\n              /* keep the canonical order, so two contracts with the same lines read alike */\n              c.w5eOwnLines = W5LINES.map(function (y) { return y.token; }).filter(function (y) { return cur.indexOf(y) >= 0; });\n              if (!c.w5eOwnLines.length) delete c.w5eOwnLines;\n            });\n          } };\n      });\n      base.w5eCount = w5l.length + ' of ' + (W5LINES.length || 8);\n      base.w5eLine = '';\n      base.oemLine = (ct.oemAccounts != null || ct.houseAccounts != null) ? 'Non-commissionable OEM accounts: ' + (ct.oemAccounts || '\\u2014') + ' \\u00b7 House accounts: ' + (ct.houseAccounts || '\\u2014') : '';\n      var tl = ct.tails || {};\n      var TL = [];\n      if (tl.mfrFlowDown) TL.push('Manufacturer flow-down: ' + tl.mfrFlowDown);\n      if (tl.houseAccountDays != null) TL.push('House-account / territory-modification tail: ' + tl.houseAccountDays + ' days.');\n      if (tl.terminationDays != null) TL.push('Post-termination tail: ' + tl.terminationDays + ' days.');\n      if (tl.note) TL.push(tl.note);\n      base.tailLines = TL;\n    }\n\n    /* ---- calculator: reads this contract's terms, stores nothing ---- */\n    var cm = st.calcModel || (MODELS[0] || {}).id;\n    var csm = st.calcSm || curSm;\n    var model = MODELS.filter(function (m) { return m.id === cm; })[0] || MODELS[0];\n    base.calcModel = cm; base.calcSm = csm;\n    base.calcModelOpts = MODELS.map(function (m) { return { v: m.id, label: m.label + ' \\u2014 ' + (m.sub || '') }; });\n    base.calcSmOpts = SM.map(function (s) { return { v: s.id, label: s.label + (s.id === curSm ? ' (current)' : '') }; });\n    var isIncome = model && model.basis === 'income';\n    base.calcIsIncome = isIncome; base.calcIsOrder = !isIncome;\n    base.calcIncPh = st.calcIncMode === '%' ? '15' : '15000';\n    var rate = ((ct.rates || {})[cm] || {})[csm];\n    var net = this.num(st.calcNet);\n    if (model && net != null && net > 0 && rate != null) {\n      var L = [];\n      if (isIncome) {\n        var incRaw = this.num(st.calcInc);\n        if (incRaw != null) {\n          var inc = st.calcIncMode === '%' ? net * incRaw / 100 : incRaw;\n          var incPct = inc / net * 100;\n          var capP = ct.flowDownCapPct != null ? ct.flowDownCapPct : (V.flowDownCapPct || 0);\n          var capD = net * capP / 100;\n          var capped = inc > capD;\n          var flow = Math.min(inc, capD);\n          L.push({ n: '1', text: 'Net sale ' + this.money(net) + ' \\u00b7 W5 gross income', val: this.money(inc) + ' (' + this.pct(incPct) + ' of net)', c: '#c6d4e2', vc: '#c6d4e2' });\n          L.push({ n: '2', text: capped ? 'Income exceeds the ' + capP + '% cap \\u2014 only ' + capP + '% of net flows down to the sales effort' : 'Income is under the ' + capP + '% cap \\u2014 the full income flows down', val: this.money(flow), c: capped ? '#e8c477' : '#9fb3c8', vc: capped ? '#e8c477' : '#c6d4e2' });\n          L.push({ n: '3', text: model.label + ' rate at ' + (SM.filter(function (s) { return s.id === csm; })[0] || {}).label + ' \\u2014 ' + rate + '% of flowed-down income', val: '\\u00d7 ' + rate + '%', c: '#9fb3c8', vc: '#c6d4e2' });\n          L.push({ n: '4', text: 'Agency commission', val: this.money(flow * rate / 100), c: '#e8eef5', vc: '#7fd39a' });\n          base.hasTrace = true; base.traceLines = L;\n        }\n      } else {\n        L.push({ n: '1', text: 'Order amount (after exclusions)', val: this.money(net), c: '#c6d4e2', vc: '#c6d4e2' });\n        L.push({ n: '2', text: model.label + ' rate at ' + (SM.filter(function (s) { return s.id === csm; })[0] || {}).label + ' \\u2014 ' + rate + '% of order amount', val: '\\u00d7 ' + rate + '%', c: '#9fb3c8', vc: '#c6d4e2' });\n        L.push({ n: '3', text: 'Agency commission', val: this.money(net * rate / 100), c: '#e8eef5', vc: '#7fd39a' });\n        base.hasTrace = true; base.traceLines = L;\n      }\n    }\n\n    var sig = (ct.signatories || []).map(function (s) { return s.who + ' (' + s.title + ', ' + s.party + ')'; }).join(' \\u00b7 ');\n    base.prov = (ct.provenance || '') + (sig ? ' \\u00b7 Signed: ' + sig : '') + (ct.docDiscrepancies ? ' \\u00b7 Doc notes: ' + ct.docDiscrepancies : '') + ' \\u00b7 terms live in the server database (agencyContracts), never in this file.';\n    base.delContract = function () {\n      if (!window.confirm('Delete the whole ' + ag.name + ' agency contract?')) return;\n      self.op('delete ' + ag.name + ' agency contract', function (r) { delete r.generalExtras.agencyContracts[cid]; });\n    };\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
