  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lex-wrap:wrap\">\n    <h1 style=\"font-size:21px;margin:0\">W5 Database Inspector<\u002Fh1>\n    <span style=\"font-size:12px;color:#5a6472\">read-only audit · source: <b>{{ sourceLabel }}<\u002Fb> · seed {{ seedTag }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#ffffff;border:1px solid #dde5ee;border-radius:10px;padding:12px 14px;margin-top:14px\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n      <b style=\"font-size:13px;color:#0D4C8F\">Database server<\u002Fb>\n      <span style=\"font-size:11.5px;color:{{ srvColor }}\">{{ srvStatus }}<\u002Fspan>\n      <span style=\"font-size:11px;color:#8a97a6;margin-left:auto\">setup steps: SETUP-Database-Server.md<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;align-items:center\">\n      <input sc-camel-on-input=\"{{ fEndpoint }}\" sc-camel-default-value=\"{{ endpointVal }}\" placeholder=\"https://script.google.com/macros/s/…/exec\" style=\"flex:1;min-width:min(100%,220px);border:1px solid #cfd9e5;border-radius:7px;padding:6px 9px;font-size:12px\">\n      <input sc-camel-on-input=\"{{ fToken }}\" sc-camel-default-value=\"{{ tokenVal }}\" placeholder=\"token\" style=\"width:150px;border:1px solid #cfd9e5;border-radius:7px;padding:6px 9px;font-size:12px\">\n      <button sc-camel-on-click=\"{{ doPing }}\" style=\"background:#0D4C8F;color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer\">Test<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ doSeed }}\" style=\"background:#1f7a33;color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer\">Seed server from this source<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:10px;margin-top:14px;flex-wrap:wrap\">\n    <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <div style=\"background:#ffffff;border:1px solid #dde5ee;border-radius:10px;padding:10px 16px;min-width:96px\">\n        <div style=\"font-size:22px;font-weight:800;color:#0D4C8F\">{{ t.n }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#5a6472;font-weight:700;text-transform:uppercase;letter-spacing:.03em\">{{ t.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#f4f8fc;border:1px solid #d7e3f0;border-radius:10px;padding:10px 14px;margin:14px 0 0;font-size:12.5px;line-height:1.65;color:#15263b\"><b style=\"color:#0D4C8F\">How to use this page.<\u002Fb> Each card checks one rule. Green means it passed. A red or amber entry opens to show <b>What this means<\u002Fb>, <b>Where to fix it<\u002Fb> and <b>How<\u002Fb>. Two kinds of fix: <b>data<\u002Fb> problems are fixed in the Workbench (open the record named, change it, press Push); <b>code<\u002Fb> problems name a file and need Claude or a developer — tell them the file and line. Grey <i>notes<\u002Fi> need no action. After fixing, press the card’s re-scan button.<\u002Fdiv>\n\n  <div style=\"background:{{ cxBg }};border:1px solid {{ cxBd }};border-radius:12px;margin-top:14px;padding:14px 18px\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <h2 style=\"font-size:15px;margin:0\">Code health — does every file still run?<\u002Fh2>\n      <span style=\"font-size:12.5px;font-weight:800;color:{{ cxColor }}\">{{ cxStatus }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ runCx }}\" style=\"margin-left:auto;flex:none;white-space:nowrap;background:#0D4C8F;color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer\">Re-check code<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;color:#5a6472;margin-top:3px\">Every app and portal file is compiled without being run. The rule scans below read files as text and stay green even when a file no longer works; this catches the break itself — one stray apostrophe can silence Ask everywhere.<\u002Fdiv>\n    <sc-if value=\"{{ hasCx }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n        <sc-for list=\"{{ cxRows }}\" as=\"cx\" hint-placeholder-count=\"1\">\n          <div style=\"border:1px solid #eec7c4;background:#fff;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#3d4a5c\">\n            <div><b style=\"color:#b3261e\">✖ {{ cx.file }}{{ cx.at }}<\u002Fb> — {{ cx.kind }}<\u002Fdiv>\n            <div style=\"color:#8a97a6;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px\">{{ cx.text }}<\u002Fdiv>\n            <div style=\"margin-top:6px;background:#f4f8fc;border:1px solid #d7e3f0;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.6;color:#15263b\">\n              <div><b style=\"color:#0D4C8F\">What this means:<\u002Fb> {{ cx.what }}<\u002Fdiv>\n              <div><b style=\"color:#0D4C8F\">Browser says:<\u002Fb> {{ cx.err }}<\u002Fdiv>\n              <div><b style=\"color:#0D4C8F\">Most likely cause:<\u002Fb> {{ cx.cause }}<\u002Fdiv>\n              <div><b style=\"color:#0D4C8F\">How:<\u002Fb> {{ cx.how }} <button type=\"button\" sc-camel-on-click=\"{{ cx.copy }}\" style=\"margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:#0D4C8F;border:none;border-radius:5px;padding:2px 9px;cursor:pointer;font-family:inherit\">Copy fix request<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ cxClean }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:8px;font-size:13px;color:#1f7a33;font-weight:700\">✓ Every file compiles — nothing is broken.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"background:{{ purityBg }};border:1px solid {{ purityBd }};border-radius:12px;margin-top:14px;padding:14px 18px\" data-comment-anchor=\"841824f878-div\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <h2 style=\"font-size:15px;margin:0\">Data purity — no data outside the database<\u002Fh2>\n      <span style=\"font-size:12.5px;font-weight:800;color:{{ purityColor }}\">{{ purityStatus }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ runScan }}\" style=\"margin-left:auto;flex:none;white-space:nowrap;background:#0D4C8F;color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer\">Re-scan app files<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;color:#5a6472;margin-top:3px\">Every app file is fetched and grepped for facts the database owns — person and partner names, territory labels, agency names, emails, phone numbers, state tables and local-storage writes. The name lists come from the database, so a record added tomorrow is caught tomorrow.<\u002Fdiv>\n    <sc-if value=\"{{ hasPurity }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:10px\">\n        <sc-for list=\"{{ purityFiles }}\" as=\"pf\" hint-placeholder-count=\"2\">\n          <details style=\"border:1px solid #e4eaf1;border-radius:8px;background:#ffffff\">\n            <summary style=\"cursor:pointer;padding:8px 12px;font-size:13px;font-weight:700;color:{{ pf.color }}\">{{ pf.badge }} {{ pf.file }} ({{ pf.count }})<span style=\"font-weight:400;color:#5a6472\"> — {{ pf.summary }}<\u002Fspan><\u002Fsummary>\n            <div style=\"margin:6px 14px 10px;background:#f4f8fc;border:1px solid #d7e3f0;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.6;color:#15263b\"><div><b style=\"color:#0D4C8F\">What this means:<\u002Fb> {{ pf.fixWhat }}<\u002Fdiv><div><b style=\"color:#0D4C8F\">Where to fix it:<\u002Fb> {{ pf.fixWhere }}<\u002Fdiv><div><b style=\"color:#0D4C8F\">How:<\u002Fb> {{ pf.fixHow }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:4px 14px 10px;font-size:12px;line-height:1.7;color:#3d4a5c\">\n              <sc-for list=\"{{ pf.rows }}\" as=\"vr\" hint-placeholder-count=\"3\">\n                <div><b style=\"color:{{ vr.color }}\">line {{ vr.line }} · {{ vr.kind }}<\u002Fb> — <code>{{ vr.match }}<\u002Fcode><div style=\"color:#8a97a6;font-size:11px\">{{ vr.text }}<\u002Fdiv><div style=\"margin:4px 0 8px 10px;padding:6px 10px;border-left:3px solid #d7e3f0;font-size:11.5px;line-height:1.55;color:#3d4a5c\"><div><b>This line is {{ vr.lineKind }}.<\u002Fb> {{ vr.rowWhat }}<\u002Fdiv><div><b>To fix:<\u002Fb> {{ vr.rowHow }} <button type=\"button\" sc-camel-on-click=\"{{ vr.copy }}\" style=\"margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:#0D4C8F;border:none;border-radius:5px;padding:2px 9px;cursor:pointer;font-family:inherit\">Copy fix request<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ purityClean }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:8px;font-size:13px;color:#1f7a33;font-weight:700\">✓ No data found in any app file — every value on screen comes from the server.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:8px;font-size:12.5px;color:#b3261e;font-weight:700\">⚠ {{ blockedCount }} local-storage write(s) blocked in this session — see the console for the key and the caller.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"background:{{ r2Bg }};border:1px solid {{ r2Bd }};border-radius:12px;margin-top:14px;padding:14px 18px\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <h2 style=\"font-size:15px;margin:0\">Rule 2 — the viewer is a public portal<\u002Fh2>\n      <span style=\"font-size:12.5px;font-weight:800;color:{{ r2Color }}\">{{ r2Status }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ runR2 }}\" sty · {{ rr.kind }}<\u002Fb> — <code>{{ rr.match }}<\u002Fcode><div style=\"color:#8a97a6;font-size:11px\">{{ rr.text }}<\u002Fdiv><div style=\"margin:4px 0 8px 10px;padding:6px 10px;border-left:3px solid #d7e3f0;font-size:11.5px;line-height:1.55;color:#3d4a5c\"><div><b>This line is {{ rr.lineKind }}.<\u002Fb> {{ rr.rowWhat }}<\u002Fdiv><div><b>To fix:<\u002Fb> {{ rr.rowHow }} <button type=\"button\" sc-camel-on-click=\"{{ rr.copy }}\" style=\"margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:#0D4C8F;border:none;border-radius:5px;padding:2px 9px;cursor:pointer;font-family:inherit\">Copy fix request<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ r2Clean }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:8px;font-size:13px;color:#1f7a33;font-weight:700\">✓ No internal wording in any partner-facing file — nothing on the portal names how we work.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasR2Notes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:8px;font-size:11.5px;color:#8a6d00\">{{ r2NoteLine }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"background:{{ r4Bg }};border:1px solid {{ r4Bd }};border-radius:12px;margin-top:14px;padding:14px 18px\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <h2 style=\"font-size:15px;margin:0\">Rule 4 — CITSA identity is internal<\u002Fh2>\n      <span style=\"font-size:12.5px;font-weight:800;color:{{ r4Color }}\">{{ r4Status }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ runR4 }}\" style=\"margin-left:auto;flex:none;white-space:nowrap;background:#0D4C8F;color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer\">Re-scan portal<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px le=\"margin-left:auto;flex:none;background:#ffffff;color:#0D4C8F;border:1px solid #cfe0f3;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer\">{{ rescanLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasFindings }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n        <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <details style=\"border:1px solid #e4eaf1;border-radius:8px;background:#fbfcfe\">\n            <summary style=\"cursor:pointer;padding:8px 12px;font-size:13px;font-weight:700;color:{{ f.color }}\">{{ f.badge }} {{ f.title }} ({{ f.count }})<span style=\"font-weight:400;color:#5a6472\"> — {{ f.why }}<\u002Fspan><\u002Fsummary>\n            <div style=\"margin:6px 14px 4px;background:#f4f8fc;border:1px solid #d7e3f0;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.6;color:#15263b\"><div><b style=\"color:#0D4C8F\">What this means:<\u002Fb> {{ f.fixWhat }}<\u002Fdiv><div><b style=\"color:#0D4C8F\">Where to fix it:<\u002Fb> {{ f.fixWhere }}<\u002Fdiv><div><b style=\"color:#0D4C8F\">How:<\u002Fb> {{ f.how }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:4px 14px 10px;font-size:12.5px;line-height:1.75;color:#3d4a5c\">\n              <sc-if value=\"{{ f.hasHow }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#f2f7fd;border:1px solid #cfe0f3;border-radius:7px;padding:7px 10px;margin:2px 0 9px;font-size:12px;line-height:1.6;color:#1c3a5e\"><b style=\"font-weight:800\">How to fix&nbsp;<\u002Fb>{{ f.how }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ f.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:baseline;gap:8px\">\n                  <span style=\"flex:1;min-width:0\">{{ it.text }}<\u002Fspan>\n                  <sc-if value=\"{{ it.hasFix }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ it.doFix }}\" title=\"{{ it.fixTip }}\" style=\"flex:none;font-size:11.5px;font-weight:700;color:#fff;background:#1f7a33;border:none;border-radius:6px;padding:3px 10px;cursor:pointer;font-family:inherit\">{{ it.fixLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ it.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n                    <a href=\"{{ it.href }}\" sc-camel-on-click=\"{{ it.go }}\" title=\"{{ it.tip }}\" style=\"flex:none;font-size:11.5px;font-weight:700;color:#0D4C8F;text-decoration:none;border:1px solid #cfe0f3;border-radius:999px;padding:1px 9px\">Fix in Workbench →<\u002Fa>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noFindings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:8px;font-size:13px;color:#1f7a33;font-weight:700\">✓ No integrity problems found — every check passed.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"background:#ffffff;border:1px solid #dde5ee;border-radius:12px;margin-top:14px;padding:14px 18px\">\n    <h2 style=\"font-size:15px;margin:0 0 10px\">Territories — coloration &amp; identity<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px\">\n      <sc-for list=\"{{ territories }}\" as=\"t\" hint-placeholder-count=\"13\">\n        <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #eef2f7;border-radius:8px;padding:8px 10px\">\n          <span style=\"width:26px;height:26px;border-radius:6px;flex:0 0 26px;background:{{ t.color }};border:2px solid #ffffff;box-shadow:0 0 0 1px #cfd8e2\"><\u002Fspan>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:12.5px;font-weight:700;whit :#5a6472;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px\">{{ g.label }} ({{ g.count }})<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:6px\">\n          <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"border:1px solid #eef2f7;border-radius:8px;padding:7px 10px;font-size:12px;background:{{ r.bg }}\">\n              <div style=\"display:flex;gap:8px;align-items:baseline\"><b style=\"font-size:12.5px\">{{ r.name }}<\u002Fb><span style=\"color:#5a6472\">{{ r.title }}<\u002Fspan><span style=\"margin-left:auto;color:#b3261e;font-weight:700;font-size:11px\">{{ r.flag }}<\u002Fspan><\u002Fdiv>\n              <div style=\"color:#3d4a5c;margin-top:2px\">{{ r.roles }}<\u002Fdiv>\n              <div style=\"color:#5a6472;margin-top:1px\">{{ r.contact }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#ffffff;border:1px solid #dde5ee;border-radius:12px;margin-top:14px;padding:14px 18px\">\n    <h2 style=\"font-size:15px;margin:0 0 4px\">Hierarchy (reports-to)<\u002Fh2>\n    <div style=\"font-size:11.5px;color:#5a6472;margin-bottom:8px\">Derived from assignment reportsTo fields. People with no manager recorded sit at top level.<\u002Fdiv>\n    <div style=\"font-size:12.5px;line-height:1.9\">\n      <sc-for list=\"{{ hierarchy }}\" as=\"h\" hint-placeholder-count=\"8\">\n        <div style=\"padding-left:{{ h.indent }}px\"><span style=\"color:#8a97a6\">{{ h.prefix }}<\u002Fspan> <b>{{ h.name }}<\u002Fb> <span style=\"color:#5a6472\">{{ h.note }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#ffffff;border:1px solid #dde5ee;border-radius:12px;margin-top:14px;padding:14px 18px\">\n    <h2 style=\"font-size:15px;margin:0 0 8px\">Role definitions in use<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n      <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"8\">\n        <span style=\"border:1px solid #dde5ee;border-radius:999px;padding:3px 11px;font-size:12px;background:{{ r.bg }}\"><b>{{ r.id }}<\u002Fb> · {{ r.label }} · {{ r.count }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    var self = this;\n    var c = this.srvCfg(), C = window.W5DBServer;\n    if (C && c.endpoint) {\n      C.configure({ endpoint: c.endpoint, token: c.token || '', actor: 'inspector' });\n      C.subscribe(function (db, reason) { if (reason === 'load' || reason === 'remote' || reason === 'local' || reason === 'staged' || reason === 'discarded' || reason === 'pushed') { self._db = null; self.forceUpdate(); } });\n      C.ready().then(function () { self._db = null; self.forceUpdate(); }).catch(function (e) { self._srvErr = e.message; self.forceUpdate(); });\n    } else { this._srvErr = 'no database server configured'; }\n    /* scans run in sequence, after the database answers — a violation is reported, not waited for */\n    var runScans = function () {\n      if (self._scansRun) return;\n      self._scansRun = true;\n      self.runScans = function () { self._scansRun = false; runScans(); };\n      [self.scanCode, self.scanPurity, self.scanRule2, self.scanRule4, self.scanRule5, self.scanRule7, self.scanRule9, self.scanRule6, self.scanRule10]\n        .reduce(function (p, fn) {\n          return p.then(function () { try { return fn.call(self); } catch (e) { return null; } });\n        }, Promise.resolve());\n    };\n    if (C && c.endpoint) C.ready().then(runScans).catch(runScans);\n    else setTimeout(runScans, 300);\n  }\n  /* Source scan: fetch every registered app file and grep it for facts the DB owns.\n     W5GUARD builds the name lists FROM the database, so this needs no list of its own. */\n  scanPurity() {\n    var self = this;\n    if (!window.W5GUARD) { this.setState({ purity: { error: 'guard not loaded' } }); return; }\n    this.setState({ purity: { running: true } });\n    return window.W5GUARD.scan().then(function (r) {\n      self.setState({ purity: r });\n      var live = (r.violations || []).filter(function (v) { return v.severity !== 'note'; });\n      if (live.length) console.error('[W5 PURITY] ' + live.length + ' data value(s) found in app files — these must move into the database:', live);\n    }).catch(function (e) { self.setState({ purity: { error: e.message } }); });\n  }\n  /* Rule 2 scan: the portal files only, judged on whether a term sits in readable copy or\n     in a comment. Separate from the purity scan because it answers a different question —\n     purity asks \"is a FACT in this file\", Rule 2 asks \"can a PARTNER read our internals\". */\n  scanRule2() {\n    var self = this;\n    if (!window.W5GUARD || !window.W5GUARD.scanPortal) { this.setState({ rule2: { error: 'guard does not implement the portal scan' } }); return; }\n    this.setState({ rule2: { running: true } });\n    return window.W5GUARD.scanPortal().then(function (r) {\n      self.setState({ rule2: r });\n      var live = (r.violations || []).filter(function (v) { return v.severity !== 'note'; });\n      if (live.length) console.error('[W5 RULE 2] ' + live.length + ' internal phrase(s) readable on a partner-facing surface:', live);\n    }).catch(function (e) { self.setState({ rule2: { error: e.message } }); });\n  }\n  /* ---- HOW TO FIX, IN PLAIN ENGLISH ----\n     Every finding on this page resolves to one entry here: what the problem is, where to go,\n     and what to do there. Written for whoever runs the platform without this chat. A kind\n     that is not listed still gets a sensible default that names the file and the rule. */\n  /* WHAT KIND OF LINE IS IT? A non-coder cannot read code, so each flagged line is classified\n     and the
